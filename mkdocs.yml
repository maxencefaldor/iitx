site_name: iitx
site_description: Integrated Information Theory accelerated in JAX
repo_url: https://github.com/maxencefaldor/iitx
repo_name: maxencefaldor/iitx
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            members_order: source
            show_source: true

nav:
  - Home: index.md
  - Design:
      - Design: design.md
      - Generality: generality.md
      - Glossary: glossary.md
  - API:
      - System: api/system.md
      - States: api/states.md
      - Direction: api/direction.md
      - Enumeration: api/enumeration.md
      - Repertoires: api/repertoires.md
      - Distances: api/distances.md
      - Transforms: api/transforms.md
      - Measures:
          - Measure: api/measures/measure.md
          - IIT 4.0: api/measures/iit4.md
          - IIT 3.0: api/measures/iit3.md
  - Contributing: contributing.md
