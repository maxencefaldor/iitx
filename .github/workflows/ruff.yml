name: ruff

on:
  push:
    branches: [main]
    paths: ["**.py", "**.ipynb", "pyproject.toml", ".github/workflows/ruff.yml"]
  pull_request:
    paths: ["**.py", "**.ipynb", "pyproject.toml", ".github/workflows/ruff.yml"]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two invocations: the action runs one ruff command per step.
      - uses: astral-sh/ruff-action@v3
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
