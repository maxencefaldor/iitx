name: ruff

on:
  push:
    branches: [main]
    paths: ["**.py", "**.ipynb", "pyproject.toml", "uv.lock", ".github/workflows/ruff.yml"]
  pull_request:
    paths: ["**.py", "**.ipynb", "pyproject.toml", "uv.lock", ".github/workflows/ruff.yml"]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Run the locked ruff through uv so CI and local checks can never diverge.
      - name: Lint
        run: uv run --python 3.14 ruff check .
      - name: Check formatting
        run: uv run --python 3.14 ruff format --check .
