name: tests

on:
  push:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "uv.lock", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["**.py", "pyproject.toml", "uv.lock", ".github/workflows/tests.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest tests/ --cov=iitx --cov-report=term-missing
