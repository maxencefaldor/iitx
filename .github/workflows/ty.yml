name: ty

on:
  push:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "uv.lock", ".github/workflows/ty.yml"]
  pull_request:
    paths: ["**.py", "pyproject.toml", "uv.lock", ".github/workflows/ty.yml"]

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev --python 3.14
      - name: Type check
        run: uv run ty check src
